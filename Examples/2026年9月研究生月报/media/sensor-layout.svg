<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 470" width="1220" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">

  <defs>
    <marker id="secArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L9,4.5 L0,8.5 Z" fill="#0b4a9e"/>
    </marker>
  </defs>

  <!-- 桥面宽度标注 -->
  <line x1="100" y1="70" x2="100" y2="95" stroke="#0b4a9e" stroke-width="1.5"/>
  <line x1="940" y1="70" x2="940" y2="95" stroke="#0b4a9e" stroke-width="1.5"/>
  <line x1="100" y1="75" x2="940" y2="75" stroke="#0b4a9e" stroke-width="1.5" marker-start="url(#secArrow)" marker-end="url(#secArrow)"/>
  <text x="520" y="68" font-size="15" fill="#0b4a9e" text-anchor="middle">桥面宽 12.0 m</text>

  <!-- 梁高标注 -->
  <line x1="54" y1="100" x2="95" y2="100" stroke="#0b4a9e" stroke-width="1.5"/>
  <line x1="54" y1="394" x2="95" y2="394" stroke="#0b4a9e" stroke-width="1.5"/>
  <line x1="60" y1="100" x2="60" y2="394" stroke="#0b4a9e" stroke-width="1.5" marker-start="url(#secArrow)" marker-end="url(#secArrow)"/>
  <text x="28" y="247" font-size="15" fill="#0b4a9e" text-anchor="middle">4.2 m</text>

  <!-- 单箱单室箱梁外轮廓 -->
  <path d="M 100,100 L 940,100 L 940,114 L 754.5,121 L 751,394 L 289,394 L 285.5,121 L 100,114 Z"
        fill="#dbe6f3" stroke="#003f88" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 箱室空腔 -->
  <path d="M 338,121 L 702,121 L 716,369.5 L 324,369.5 Z"
        fill="#ffffff" stroke="#003f88" stroke-width="2" stroke-linejoin="round"/>

  <!-- 应变测点 S1 - S8 -->
  <rect x="359" y="122" width="14" height="14" fill="#003f88"/>
  <text x="366" y="155" font-size="14" fill="#334155" text-anchor="middle">S1</text>
  <rect x="667" y="122" width="14" height="14" fill="#003f88"/>
  <text x="674" y="155" font-size="14" fill="#334155" text-anchor="middle">S2</text>
  <rect x="333" y="233" width="14" height="14" fill="#003f88"/>
  <text x="356" y="245" font-size="14" fill="#334155">S3</text>
  <rect x="693" y="233" width="14" height="14" fill="#003f88"/>
  <text x="684" y="245" font-size="14" fill="#334155" text-anchor="end">S4</text>
  <rect x="328.6" y="317" width="14" height="14" fill="#003f88"/>
  <text x="351" y="329" font-size="14" fill="#334155">S5</text>
  <rect x="697.4" y="317" width="14" height="14" fill="#003f88"/>
  <text x="688" y="329" font-size="14" fill="#334155" text-anchor="end">S6</text>
  <rect x="380" y="355" width="14" height="14" fill="#003f88"/>
  <text x="403" y="360" font-size="14" fill="#334155">S7</text>
  <rect x="646" y="355" width="14" height="14" fill="#003f88"/>
  <text x="653" y="344" font-size="14" fill="#334155" text-anchor="middle">S8</text>

  <!-- 温度测点 T1 - T4 -->
  <circle cx="450" cy="129" r="8" fill="#c00000"/>
  <text x="450" y="155" font-size="14" fill="#334155" text-anchor="middle">T1</text>
  <circle cx="343" cy="191" r="8" fill="#c00000"/>
  <text x="357" y="196" font-size="14" fill="#334155">T2</text>
  <circle cx="702" cy="282" r="8" fill="#c00000"/>
  <text x="688" y="287" font-size="14" fill="#334155" text-anchor="end">T3</text>
  <circle cx="590" cy="362" r="8" fill="#c00000"/>
  <text x="590" y="344" font-size="14" fill="#334155" text-anchor="middle">T4</text>

  <!-- 测点类型图例 -->
  <text x="975" y="120" font-size="17" font-weight="bold" fill="#003f88">测点类型</text>
  <rect x="975" y="154" width="14" height="14" fill="#003f88"/>
  <text x="997" y="166" font-size="15" fill="#334155">应变测点 S1–S8</text>
  <circle cx="982" cy="200" r="7" fill="#c00000"/>
  <text x="997" y="206" font-size="15" fill="#334155">温度测点 T1–T4</text>

  <line x1="970" y1="230" x2="1190" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="975" y="262" font-size="15" fill="#334155">每断面 12 个测点</text>
  <text x="975" y="292" font-size="15" fill="#334155">全桥布设 4 个断面</text>
  <text x="975" y="322" font-size="16" font-weight="bold" fill="#003f88">合计 48 个测点</text>

  <!-- 截面尺寸说明 -->
  <text x="100" y="440" font-size="15" fill="#64748b">跨中截面尺寸：梁高 4.2 m　顶板厚 0.28 m　底板厚 0.35 m　腹板厚 0.50 m</text>

</svg>
