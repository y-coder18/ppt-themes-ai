<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 112" width="1216" height="112" role="img" aria-label="一张由十七个节点连成的网，居中一个深蓝节点被周围所有节点连通，象征一切烦恼都产生于与他人的连接之中">
  <!-- 一切烦恼都是人际关系的烦恼：一张人际关系的网。
       每个节点都是一个人，深蓝的那个是「我」——他被整张网连着，
       所以孤独、竞争、认可欲求才会成立。抽掉别的节点，这个点就什么都不是。
       三行节点错开半格排布，横竖都连上，才像「谁都躲不开谁」；
       行内 y 值略作起伏，免得规整成电路板。 -->

  <!-- 网线：行内相连 + 相邻两行之间相连 -->
  <g stroke="#c5d5e8" stroke-width="1.5" stroke-linecap="round">
    <!-- 第一行 -->
    <line x1="83"  y1="24" x2="293"  y2="20"/>
    <line x1="293" y1="20" x2="503"  y2="26"/>
    <line x1="503" y1="26" x2="713"  y2="21"/>
    <line x1="713" y1="21" x2="923"  y2="27"/>
    <line x1="923" y1="27" x2="1133" y2="23"/>
    <!-- 第二行 -->
    <line x1="188"  y1="60" x2="398"  y2="54"/>
    <line x1="398"  y1="54" x2="608"  y2="58"/>
    <line x1="608"  y1="58" x2="818"  y2="62"/>
    <line x1="818"  y1="62" x2="1028" y2="55"/>
    <!-- 第三行 -->
    <line x1="83"  y1="92" x2="293"  y2="88"/>
    <line x1="293" y1="88" x2="503"  y2="94"/>
    <line x1="503" y1="94" x2="713"  y2="89"/>
    <line x1="713" y1="89" x2="923"  y2="93"/>
    <line x1="923" y1="93" x2="1133" y2="90"/>
    <!-- 第一、二行之间 -->
    <line x1="83"  y1="24" x2="188" y2="60"/>
    <line x1="293" y1="20" x2="188" y2="60"/>
    <line x1="293" y1="20" x2="398" y2="54"/>
    <line x1="503" y1="26" x2="398" y2="54"/>
    <line x1="503" y1="26" x2="608" y2="58"/>
    <line x1="713" y1="21" x2="608" y2="58"/>
    <line x1="713" y1="21" x2="818" y2="62"/>
    <line x1="923" y1="27" x2="818" y2="62"/>
    <line x1="923" y1="27" x2="1028" y2="55"/>
    <line x1="1133" y1="23" x2="1028" y2="55"/>
    <!-- 第二、三行之间 -->
    <line x1="188" y1="60" x2="83"  y2="92"/>
    <line x1="188" y1="60" x2="293" y2="88"/>
    <line x1="398" y1="54" x2="293" y2="88"/>
    <line x1="398" y1="54" x2="503" y2="94"/>
    <line x1="608" y1="58" x2="503" y2="94"/>
    <line x1="608" y1="58" x2="713" y2="89"/>
    <line x1="818" y1="62" x2="713" y2="89"/>
    <line x1="818" y1="62" x2="923" y2="93"/>
    <line x1="1028" y1="55" x2="923" y2="93"/>
    <line x1="1028" y1="55" x2="1133" y2="90"/>
  </g>

  <!-- 节点：除「我」以外都退成浅灰，让视觉重心落回中心那一个 -->
  <g fill="#9fb1c4">
    <circle cx="83"   cy="24" r="7.5"/> <circle cx="293"  cy="20" r="7.5"/>
    <circle cx="503"  cy="26" r="7.5"/> <circle cx="713"  cy="21" r="7.5"/>
    <circle cx="923"  cy="27" r="7.5"/> <circle cx="1133" cy="23" r="7.5"/>
    <circle cx="188"  cy="60" r="7.5"/> <circle cx="398"  cy="54" r="7.5"/>
    <circle cx="818"  cy="62" r="7.5"/> <circle cx="1028" cy="55" r="7.5"/>
    <circle cx="83"   cy="92" r="7.5"/> <circle cx="293"  cy="88" r="7.5"/>
    <circle cx="503"  cy="94" r="7.5"/> <circle cx="713"  cy="89" r="7.5"/>
    <circle cx="923"  cy="93" r="7.5"/> <circle cx="1133" cy="90" r="7.5"/>
  </g>
  <circle cx="608" cy="58" r="12" fill="#003f88"/>
</svg>
