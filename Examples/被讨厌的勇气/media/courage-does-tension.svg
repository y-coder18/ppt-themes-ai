<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 148" width="340" height="148" role="img" aria-label="折线三次来回折返，每一折都比上一折更高，末端箭头朝右上，表示读者被一级一级推上去">
  <!-- 制造张力：来回折返，但每一折的落点都比上一折高。
       「青年的反驳就是读者的反驳」——质疑被回应一次，读者就往上一格，
       所以折线不是水平的锯齿，是整体在爬坡。 -->

  <defs>
    <marker id="dtArr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L11,6 L0,12 Z" fill="#006400"/>
    </marker>
  </defs>

  <path d="M 28,126 L 78,80 L 128,118 L 178,68 L 228,106 L 278,56 L 312,30"
        fill="none" stroke="#006400" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtArr)"/>
</svg>
