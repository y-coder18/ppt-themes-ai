<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 130" width="1216" height="130" role="img" aria-label="一条蓝线横贯画面，在中途三处被红、黄、灰三截锯齿状的折线替换掉，表示这本书有三处接不上">
  <!-- 三处值得警惕：一条蓝线是这本书的主线，三处被折线顶开。
       折线不做成断口而做成锯齿——断口看着像「没写完」，
       锯齿才是「这里硌人」；锯口两端仍落在中线上，读起来只是一段被换了料。
       三截的颜色跟下面三张卡一一对应：红 01、黄 02、灰 03。 -->

  <!-- 主线：四段，中间三处留给折线 -->
  <g stroke="#003f88" stroke-width="5" stroke-linecap="round">
    <line x1="0"   y1="65" x2="244" y2="65"/>
    <line x1="344" y1="65" x2="538" y2="65"/>
    <line x1="638" y1="65" x2="832" y2="65"/>
    <line x1="932" y1="65" x2="1176" y2="65"/>
  </g>

  <!-- 三处锯口 -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 244,65 L 269,40 L 294,90 L 319,40 L 344,65" stroke="#c00000"/>
    <path d="M 538,65 L 563,40 L 588,90 L 613,40 L 638,65" stroke="#b87a14"/>
    <path d="M 832,65 L 857,40 L 882,90 L 907,40 L 932,65" stroke="#455a64"/>
  </g>
</svg>
