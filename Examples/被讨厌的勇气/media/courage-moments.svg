<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 66" width="1216" height="66" role="img" aria-label="一条连续的直线向右逐渐散开成一串起伏的圆点，象征人生不是通往终点的线，而是一连串的刹那">
  <!-- 人生是连续的刹那：左边是一条奔向终点的直线，向右渐渐散开成起伏的点。
       点的间距逐次拉大、半径逐次变大、高度呈正弦起伏——「像跳舞一样」。
       无描边、纯实心，缩到 66px 高仍然清爽。 -->

  <!-- 直的一段：通往某个终点的线 -->
  <line x1="104" y1="33" x2="624" y2="33" stroke="#003f88" stroke-width="3" stroke-linecap="round"/>

  <!-- 散成刹那：间距递增、半径递增、纵向起伏 -->
  <g fill="#003f88">
    <circle cx="644" cy="33.0" r="5.0"/>
    <circle cx="682" cy="40.0" r="5.35"/>
    <circle cx="724" cy="41.8" r="5.7"/>
    <circle cx="772" cy="36.8" r="6.05"/>
    <circle cx="826" cy="29.0" r="6.4"/>
    <circle cx="886" cy="24.2" r="6.75"/>
    <circle cx="952" cy="26.0" r="7.1"/>
    <circle cx="1024" cy="34.0" r="7.45"/>
    <circle cx="1104" cy="40.7" r="7.8"/>
  </g>
</svg>
