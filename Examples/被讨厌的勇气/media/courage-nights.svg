<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 64" width="1216" height="64" role="img" aria-label="五个夜晚的月相：由细月牙渐次盈满，第五夜为满月，以红蓝绿三色对应破、立、合三个阶段">
  <!-- 五轮月相：第一夜细月牙 → 第五夜满月。颜色呼应「破 · 立 · 合」三个阶段
       （红 #c00000 / 蓝 #003f88 / 绿 #006400），与下一页「论证的弧线」同一套色彩语音。
       月相用「右半圆 + 明暗界线椭圆」两条弧拼成，无描边、纯实心，缩到 64px 高仍然清爽。 -->

  <!-- 第一夜 · 破（细月牙） -->
  <path d="M 100,6 A 26,26 0 0 1 100,58 A 16.1,26 0 0 0 100,6 Z" fill="#c00000"/>
  <!-- 第二夜 · 破 -->
  <path d="M 354,6 A 26,26 0 0 1 354,58 A 7.3,26 0 0 0 354,6 Z" fill="#c00000"/>
  <!-- 第三夜 · 立（半月） -->
  <path d="M 608,6 A 26,26 0 0 1 608,58 A 0,26 0 0 0 608,6 Z" fill="#003f88"/>
  <!-- 第四夜 · 立（凸月） -->
  <path d="M 862,6 A 26,26 0 0 1 862,58 A 7.3,26 0 0 1 862,6 Z" fill="#003f88"/>
  <!-- 第五夜 · 合（满月） -->
  <path d="M 1116,6 A 26,26 0 0 1 1116,58 A 26,26 0 0 1 1116,6 Z" fill="#006400"/>
</svg>
