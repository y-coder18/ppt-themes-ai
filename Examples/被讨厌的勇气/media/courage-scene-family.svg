<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 104" width="340" height="104" role="img" aria-label="中间一条竖直虚线，左边一个大实心圆，右边一个小空心圆，两个圆底边齐平">
  <!-- 亲子：父母与孩子。
       三张「现场」共用同一套语法——中间竖虚线是边界，左边实心圆是「我的课题」，
       右边空心圆是「对方的课题」。空心表示那半边不由我填。
       这一张的差别在大小：左大右小、底边齐平，责任不对等。
       画布 340 宽是量着 feature 卡片的内容框定的（385 − 左右各 22 内边距）；
       高 104 是让标题下面那段读图说明放得下——先按 148 画的，那一版整页只剩 24px 余量。 -->

  <line x1="170" y1="6" x2="170" y2="98" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="8 7"/>
  <circle cx="88"  cy="56" r="30" fill="#003f88"/>
  <circle cx="252" cy="66" r="20" fill="none" stroke="#003f88" stroke-width="3"/>
</svg>
