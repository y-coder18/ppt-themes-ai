<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 148" width="340" height="148" role="img" aria-label="四级台阶一路走低，末端一支箭头平着踏出去，表示门槛越来越低">
  <!-- 降低门槛：台阶一路走低，最后一步是平着踏进去的，不用抬腿。
       四级而不是三级——卡片内容框 341px 宽、148px 高，两级显得太空。
       画布 340 宽是量着 feature 卡片的内容框定的（385 − 左右各 22 内边距）。 -->

  <defs>
    <marker id="dtArr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L11,6 L0,12 Z" fill="#003f88"/>
    </marker>
  </defs>

  <path d="M 30,30 L 105,30 L 105,60 L 180,60 L 180,90 L 255,90 L 255,120 L 312,120"
        fill="none" stroke="#003f88" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtArr)"/>
</svg>
