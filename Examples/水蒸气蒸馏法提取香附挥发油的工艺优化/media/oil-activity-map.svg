<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="200" viewBox="0 0 1220 200">
  <defs>
    <marker id="bl" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0b4a9e"/>
    </marker>
    <marker id="gr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#006400"/>
    </marker>
  </defs>
  <rect width="1220" height="200" fill="#ffffff"/>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif">

    <!-- 左端：挥发油 -->
    <rect x="20" y="44" width="196" height="112" rx="8" fill="#0b4a9e"/>
    <text x="118" y="88" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">香附挥发油</text>
    <text x="118" y="110" font-size="12" fill="#cfe1f7" text-anchor="middle">倍半萜类为主</text>
    <text x="118" y="128" font-size="12" fill="#cfe1f7" text-anchor="middle">成分数十种</text>

    <!-- 成分侧汇流主干 -->
    <line x1="216" y1="100" x2="240" y2="100" stroke="#0b4a9e" stroke-width="2" marker-end="url(#bl)"/>
    <line x1="252" y1="34" x2="252" y2="166" stroke="#0b4a9e" stroke-width="1.6"/>
    <line x1="252" y1="34" x2="268" y2="34" stroke="#0b4a9e" stroke-width="1.6" marker-end="url(#bl)"/>
    <line x1="252" y1="78" x2="268" y2="78" stroke="#0b4a9e" stroke-width="1.6" marker-end="url(#bl)"/>
    <line x1="252" y1="122" x2="268" y2="122" stroke="#0b4a9e" stroke-width="1.6" marker-end="url(#bl)"/>
    <line x1="252" y1="166" x2="268" y2="166" stroke="#0b4a9e" stroke-width="1.6" marker-end="url(#bl)"/>

    <!-- 成分卡 -->
    <rect x="276" y="16" width="340" height="36" rx="6" fill="#f7fafd" stroke="#c4d6f0" stroke-width="1.4"/>
    <line x1="276" y1="21" x2="276" y2="47" stroke="#0b4a9e" stroke-width="4"/>
    <text x="296" y="31" font-size="13.5" font-weight="bold" fill="#003f88">α-香附酮</text>
    <text x="296" y="47" font-size="11.5" fill="#475569">含量最高的特征性成分，疏肝理气的主要物质基础</text>

    <rect x="276" y="60" width="340" height="36" rx="6" fill="#f7fafd" stroke="#c4d6f0" stroke-width="1.4"/>
    <line x1="276" y1="65" x2="276" y2="91" stroke="#0b4a9e" stroke-width="4"/>
    <text x="296" y="75" font-size="13.5" font-weight="bold" fill="#003f88">香附烯 · α-芹子烯 · β-芹子烯</text>
    <text x="296" y="91" font-size="11.5" fill="#475569">代表性倍半萜烯类，含量占比次之</text>

    <rect x="276" y="104" width="340" height="36" rx="6" fill="#f7fafd" stroke="#c4d6f0" stroke-width="1.4"/>
    <line x1="276" y1="109" x2="276" y2="135" stroke="#0b4a9e" stroke-width="4"/>
    <text x="296" y="119" font-size="13.5" font-weight="bold" fill="#003f88">β-香附酮 · 香附子烯 · 氧化石竹烯</text>
    <text x="296" y="135" font-size="11.5" fill="#475569">含氧倍半萜类，与抗炎、镇痛活性相关</text>

    <rect x="276" y="148" width="340" height="36" rx="6" fill="#f7fafd" stroke="#c4d6f0" stroke-width="1.4"/>
    <line x1="276" y1="153" x2="276" y2="179" stroke="#0b4a9e" stroke-width="4"/>
    <text x="296" y="163" font-size="13.5" font-weight="bold" fill="#003f88">1,8-桉叶油醇 · β-石竹烯</text>
    <text x="296" y="179" font-size="11.5" fill="#475569">单萜与含氧衍生物，促胃肠动力</text>

    <!-- 活性侧汇流主干 -->
    <line x1="616" y1="34" x2="652" y2="34" stroke="#006400" stroke-width="1.6" marker-end="url(#gr)"/>
    <line x1="616" y1="78" x2="652" y2="78" stroke="#006400" stroke-width="1.6" marker-end="url(#gr)"/>
    <line x1="616" y1="122" x2="652" y2="122" stroke="#006400" stroke-width="1.6" marker-end="url(#gr)"/>
    <line x1="616" y1="166" x2="652" y2="166" stroke="#006400" stroke-width="1.6" marker-end="url(#gr)"/>
    <line x1="664" y1="34" x2="664" y2="166" stroke="#006400" stroke-width="1.6"/>
    <line x1="664" y1="42" x2="796" y2="42" stroke="#006400" stroke-width="1.8" marker-end="url(#gr)"/>
    <line x1="664" y1="102" x2="796" y2="102" stroke="#006400" stroke-width="1.8" marker-end="url(#gr)"/>
    <line x1="664" y1="162" x2="796" y2="162" stroke="#006400" stroke-width="1.8" marker-end="url(#gr)"/>

    <!-- 活性卡 -->
    <rect x="800" y="16" width="400" height="52" rx="6" fill="#f2f9f4" stroke="#c3ddc9" stroke-width="1.4"/>
    <line x1="800" y1="21" x2="800" y2="63" stroke="#006400" stroke-width="4"/>
    <text x="824" y="40" font-size="14" font-weight="bold" fill="#006400">抗抑郁 · 抗焦虑</text>
    <text x="824" y="58" font-size="11.5" fill="#3f5a45">调节中枢单胺类递质</text>

    <rect x="800" y="76" width="400" height="52" rx="6" fill="#f2f9f4" stroke="#c3ddc9" stroke-width="1.4"/>
    <line x1="800" y1="81" x2="800" y2="123" stroke="#006400" stroke-width="4"/>
    <text x="824" y="100" font-size="14" font-weight="bold" fill="#006400">镇痛 · 抗炎</text>
    <text x="824" y="118" font-size="11.5" fill="#3f5a45">抑制前列腺素合成</text>

    <rect x="800" y="136" width="400" height="52" rx="6" fill="#f2f9f4" stroke="#c3ddc9" stroke-width="1.4"/>
    <line x1="800" y1="141" x2="800" y2="183" stroke="#006400" stroke-width="4"/>
    <text x="824" y="160" font-size="14" font-weight="bold" fill="#006400">调经止痛 · 促胃肠动力</text>
    <text x="824" y="178" font-size="11.5" fill="#3f5a45">雌激素样作用，改善肝郁气滞证候</text>

  </g>
</svg>
