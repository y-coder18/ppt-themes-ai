<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="400" viewBox="0 0 1220 400">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b4a9e"/>
    </marker>
  </defs>
  <rect width="1220" height="400" fill="#ffffff"/>

  <rect x="60" y="40" width="330" height="110" rx="6" fill="#f7fafd" stroke="#c4d6f0" stroke-width="1.4"/>
  <line x1="60" y1="46" x2="60" y2="144" stroke="#003f88" stroke-width="5"/>
  <circle cx="76" cy="64" r="12.5" fill="#003f88"/>
  <text x="76" y="69" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">01</text>
  <text x="98" y="69" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#003f88">文献调研与方案设计</text>
  <text x="78" y="94" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">香附挥发油研究进展与提取方法对比</text>
  <text x="78" y="112" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">确定水蒸气蒸馏法工艺优化技术路线</text>
  <text x="78" y="130" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">明确响应指标与评价方法</text>

  <rect x="445" y="40" width="330" height="110" rx="6" fill="#f7fafd" stroke="#c4d6f0" stroke-width="1.4"/>
  <line x1="445" y1="46" x2="445" y2="144" stroke="#003f88" stroke-width="5"/>
  <circle cx="461" cy="64" r="12.5" fill="#003f88"/>
  <text x="461" y="69" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">02</text>
  <text x="483" y="69" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#003f88">药材鉴定与前处理</text>
  <text x="463" y="94" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">鉴定为莎草科莎草 Cyperus rotundus L.</text>
  <text x="463" y="112" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">干燥根茎，粉碎并分级过筛</text>
  <text x="463" y="130" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">药典甲法测定本底含油量</text>

  <rect x="830" y="40" width="330" height="110" rx="6" fill="#f7fafd" stroke="#c4d6f0" stroke-width="1.4"/>
  <line x1="830" y1="46" x2="830" y2="144" stroke="#003f88" stroke-width="5"/>
  <circle cx="846" cy="64" r="12.5" fill="#003f88"/>
  <text x="846" y="69" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">03</text>
  <text x="868" y="69" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#003f88">单因素实验</text>
  <text x="848" y="94" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">粉碎粒度 · 浸泡时间 · 液料比</text>
  <text x="848" y="112" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">蒸馏时间 · NaCl 用量</text>
  <text x="848" y="130" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">确定显著因素及适宜水平区间</text>

  <line x1="390" y1="95" x2="441" y2="95" stroke="#0b4a9e" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="775" y1="95" x2="826" y2="95" stroke="#0b4a9e" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="995" y1="150" x2="995" y2="236" stroke="#0b4a9e" stroke-width="2.2" marker-end="url(#ar)"/>

  <rect x="830" y="240" width="330" height="110" rx="6" fill="#f7fafd" stroke="#c4d6f0" stroke-width="1.4"/>
  <line x1="830" y1="246" x2="830" y2="344" stroke="#003f88" stroke-width="5"/>
  <circle cx="846" cy="264" r="12.5" fill="#003f88"/>
  <text x="846" y="269" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">04</text>
  <text x="868" y="269" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#003f88">响应面设计与试验</text>
  <text x="848" y="294" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">Box-Behnken 三因素三水平设计</text>
  <text x="848" y="312" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">17 次试验，5 个中心点重复</text>
  <text x="848" y="330" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">以挥发油得率为响应值</text>

  <rect x="445" y="240" width="330" height="110" rx="6" fill="#f7fafd" stroke="#c4d6f0" stroke-width="1.4"/>
  <line x1="445" y1="246" x2="445" y2="344" stroke="#003f88" stroke-width="5"/>
  <circle cx="461" cy="264" r="12.5" fill="#003f88"/>
  <text x="461" y="269" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">05</text>
  <text x="483" y="269" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#003f88">回归建模与工艺优化</text>
  <text x="463" y="294" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">二次多项式回归模型拟合</text>
  <text x="463" y="312" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">方差分析与因素交互作用解析</text>
  <text x="463" y="330" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">求解最优工艺参数组合</text>

  <rect x="60" y="240" width="330" height="110" rx="6" fill="#f7fafd" stroke="#c4d6f0" stroke-width="1.4"/>
  <line x1="60" y1="246" x2="60" y2="344" stroke="#003f88" stroke-width="5"/>
  <circle cx="76" cy="264" r="12.5" fill="#003f88"/>
  <text x="76" y="269" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">06</text>
  <text x="98" y="269" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#003f88">验证与成分表征</text>
  <text x="78" y="294" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">最优条件下 3 次平行验证实验</text>
  <text x="78" y="312" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">GC-MS 测定挥发油化学成分</text>
  <text x="78" y="330" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#475569">与传统工艺比较并评价相似度</text>

  <line x1="830" y1="295" x2="779" y2="295" stroke="#0b4a9e" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="445" y1="295" x2="394" y2="295" stroke="#0b4a9e" stroke-width="2.2" marker-end="url(#ar)"/>
</svg>
