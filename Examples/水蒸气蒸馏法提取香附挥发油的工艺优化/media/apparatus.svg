<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="480" viewBox="0 0 1220 480">
  <defs>
    <marker id="fl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f7fc1"/>
    </marker>
    <marker id="vu" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,8 L4,0 L8,8 z" fill="#7fb0dc"/>
    </marker>
  </defs>
  <rect width="1220" height="480" fill="#ffffff"/>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif">

    <!-- 冷却水出口（右上） -->
    <rect x="454" y="42" width="66" height="14" fill="#cfe4f5" stroke="#64748b" stroke-width="1.4"/>
    <line x1="500" y1="49" x2="514" y2="49" stroke="#2f7fc1" stroke-width="2.2" marker-end="url(#fl)"/>
    <text x="524" y="54" font-size="13" fill="#2f7fc1" font-weight="bold">冷却水出</text>

    <!-- 冷却水入口（左上） -->
    <rect x="300" y="94" width="86" height="14" fill="#cfe4f5" stroke="#64748b" stroke-width="1.4"/>
    <line x1="352" y1="101" x2="368" y2="101" stroke="#2f7fc1" stroke-width="2.2" marker-end="url(#fl)"/>
    <text x="292" y="105" font-size="13" fill="#2f7fc1" font-weight="bold" text-anchor="end">冷却水进</text>

    <!-- 冷凝管 -->
    <rect x="386" y="30" width="68" height="92" rx="7" fill="#eaf4fb" stroke="#64748b" stroke-width="1.6"/>
    <rect x="410" y="30" width="20" height="92" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <ellipse cx="420" cy="60" rx="2.6" ry="4.4" fill="#a9cbe8"/>
    <ellipse cx="420" cy="84" rx="2.6" ry="4.4" fill="#a9cbe8"/>
    <ellipse cx="420" cy="108" rx="2.6" ry="4.4" fill="#a9cbe8"/>

    <!-- 冷凝管与测定管之间的连接管 -->
    <rect x="404" y="120" width="32" height="30" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>

    <!-- 挥发油测定管 -->
    <rect x="396" y="148" width="48" height="100" fill="#dceafa" stroke="#64748b" stroke-width="1.6"/>
    <rect x="398" y="155" width="44" height="31" fill="#f0d79a"/>
    <!-- 管内左侧分度刻线 -->
    <line x1="396" y1="155" x2="410" y2="155" stroke="#475569" stroke-width="1.3"/>
    <line x1="396" y1="161" x2="404" y2="161" stroke="#475569" stroke-width="1"/>
    <line x1="396" y1="167" x2="404" y2="167" stroke="#475569" stroke-width="1"/>
    <line x1="396" y1="173" x2="404" y2="173" stroke="#475569" stroke-width="1"/>
    <line x1="396" y1="179" x2="404" y2="179" stroke="#475569" stroke-width="1"/>
    <line x1="396" y1="186" x2="410" y2="186" stroke="#475569" stroke-width="1.3"/>

    <!-- 水回流支管 -->
    <path d="M444,232 L492,232 L492,294 L438,294" fill="none" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- 烧瓶颈（蒸汽上升段） -->
    <rect x="404" y="246" width="32" height="48" fill="#fbfdff" stroke="#64748b" stroke-width="1.5"/>
    <line x1="412" y1="284" x2="412" y2="264" stroke="#7fb0dc" stroke-width="2" marker-end="url(#vu)"/>
    <line x1="420" y1="284" x2="420" y2="264" stroke="#7fb0dc" stroke-width="2" marker-end="url(#vu)"/>
    <line x1="428" y1="284" x2="428" y2="264" stroke="#7fb0dc" stroke-width="2" marker-end="url(#vu)"/>

    <!-- 圆底烧瓶 -->
    <circle cx="420" cy="348" r="58" fill="#f7fbff" stroke="#64748b" stroke-width="1.6"/>
    <path d="M364.9,330 A58,58 0 0 0 475.1,330 Z" fill="#dceafa"/>
    <line x1="364.9" y1="330" x2="475.1" y2="330" stroke="#64748b" stroke-width="1.3"/>
    <circle cx="400" cy="374" r="4.4" fill="#c0a06a"/>
    <circle cx="418" cy="382" r="5" fill="#b08f5c"/>
    <circle cx="437" cy="372" r="4.2" fill="#c0a06a"/>
    <circle cx="410" cy="392" r="4.6" fill="#b08f5c"/>
    <circle cx="432" cy="392" r="3.8" fill="#c0a06a"/>

    <!-- 电热套 -->
    <path d="M336,406 L504,406 L504,438 Q504,452 490,452 L350,452 Q336,452 336,438 Z" fill="#e8eef7" stroke="#64748b" stroke-width="1.5"/>
    <text x="420" y="435" font-size="13.5" fill="#334155" text-anchor="middle">电热套</text>

    <!-- 右侧引线标注 -->
    <line x1="554" y1="78" x2="458" y2="78" stroke="#94a3b8" stroke-width="1.1"/>
    <text x="560" y="82" font-size="13.5" fill="#334155">冷凝管（回流冷凝）</text>

    <line x1="554" y1="180" x2="448" y2="180" stroke="#94a3b8" stroke-width="1.1"/>
    <text x="560" y="184" font-size="13.5" fill="#334155">挥发油测定管（分度值 0.02 mL）</text>

    <line x1="554" y1="262" x2="496" y2="262" stroke="#94a3b8" stroke-width="1.1"/>
    <text x="560" y="266" font-size="13.5" fill="#334155">水回流支管</text>

    <line x1="554" y1="345" x2="482" y2="345" stroke="#94a3b8" stroke-width="1.1"/>
    <text x="560" y="349" font-size="13.5" fill="#334155">圆底烧瓶：香附粉 50.0 g + 蒸馏水</text>

    <!-- 左侧管内标注 -->
    <text x="388" y="174" font-size="13" fill="#a16207" font-weight="bold" text-anchor="end">油层（挥发油）</text>
    <text x="388" y="219" font-size="13" fill="#1d5b96" text-anchor="end">水层</text>
  </g>
</svg>
